<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Schnee-Checker</title>

<!-- App-Installation (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e1e24">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schnee-Checker">

<!-- Leaflet (OpenStreetMap-Karte) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --panel-bg: #1e1e24; --card-bg: #26262e; --fg: #e6e6ea; --muted: #9a9aa5;
    --accent: #d63a2f; --accent-active: #b8281f; --trough: #3a3a44;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { overflow: hidden; }

  #app { position: fixed; inset: 0; display: flex; }
  #map { flex: 1 1 auto; height: 100%; background: #e8e4dc; }

  #crosshair { position: absolute; inset: 0; pointer-events: none; z-index: 500; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(0,0,0,.45); }
  #crosshair::before { left: 50%; top: 50%; width: 1px; height: 24px; transform: translate(-50%,-50%); }
  #crosshair::after  { left: 50%; top: 50%; width: 24px; height: 1px; transform: translate(-50%,-50%); }

  #info { position: absolute; left: 10px; bottom: 10px; z-index: 500;
    background: rgba(0,0,0,.6); color: #fff; padding: 4px 8px; border-radius: 6px;
    font-size: 12px; pointer-events: none; }

  #panel { flex: 0 0 300px; background: var(--panel-bg); color: var(--fg);
    padding: 18px; overflow-y: auto; z-index: 600; }
  #panel h1 { margin: 0; font-size: 20px; }
  #panel .sub { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
  .section { font-weight: 700; font-size: 14px; margin: 14px 0 6px; }

  .search { display: flex; gap: 8px; margin-bottom: 4px; }
  .search input { flex: 1; min-width: 0; background: var(--card-bg); color: var(--fg);
    border: 1px solid var(--trough); border-radius: 8px; padding: 9px 10px; font-size: 15px; }
  .search button { flex: 0 0 auto; background: var(--card-bg); color: var(--fg);
    border: 1px solid var(--trough); border-radius: 8px; padding: 0 14px; font-size: 15px; cursor: pointer; }

  .modes { display: flex; gap: 8px; }
  .modes button { flex: 1; padding: 9px 0; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--card-bg); color: var(--fg); font-size: 15px; }
  .modes button.active { background: var(--accent); color: #fff; }

  input[type=range] { width: 100%; accent-color: var(--accent); }

  #refresh { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  #refresh:active { background: var(--accent-active); }
  #refresh:disabled { opacity: .6; cursor: default; }

  #status { color: var(--muted); font-size: 13px; margin: 10px 0 6px; min-height: 18px; }
  #bar { width: 100%; height: 8px; background: var(--trough); border-radius: 5px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  #legend-bar { height: 14px; border-radius: 7px; margin-top: 4px;
    background: linear-gradient(to right, #eee, #999); }
  #legend-labels { display: flex; justify-content: space-between; color: var(--muted);
    font-size: 12px; margin-top: 3px; }
  #legend-note { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.35; }

  /* eigene Karten-Buttons (Standort) */
  .leaflet-bar a.locate { font-size: 18px; line-height: 30px; text-align: center; }

  #handle { display: none; }
  @media (max-width: 720px) {
    #app { flex-direction: column; }
    #panel { position: fixed; left: 0; right: 0; bottom: 0; flex: none; max-height: 66vh;
      border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.35);
      padding-top: 8px; padding-bottom: calc(18px + env(safe-area-inset-bottom));
      transition: transform .25s ease; }
    #panel.collapsed { transform: translateY(calc(100% - 122px)); }
    #handle { display: block; width: 42px; height: 5px; border-radius: 3px;
      background: var(--trough); margin: 4px auto 12px; cursor: pointer; }
    #info { bottom: calc(122px + 10px); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="crosshair"></div>
    <div id="info">Zoom –</div>
  </div>

  <div id="panel" class="collapsed">
    <div id="handle" title="Auf-/zuklappen"></div>
    <h1>Schnee-Checker</h1>
    <div class="sub">Höhe und Schnee auf der Karte</div>

    <div class="search">
      <input id="search-input" type="text" placeholder="Ort suchen (z. B. Zermatt)" enterkeyhint="search">
      <button id="search-btn">Suchen</button>
    </div>

    <div class="section">Modus</div>
    <div class="modes">
      <button class="active" data-mode="hoehe">Höhe</button>
      <button data-mode="schnee">Schnee</button>
    </div>

    <div class="section" id="threshold-label">Schwelle: 1500 m</div>
    <input type="range" id="threshold" min="0" max="4000" step="50" value="1500">

    <div class="section" id="resolution-label">Feinheit: 3 / 6</div>
    <input type="range" id="resolution" min="1" max="6" step="1" value="3">

    <button id="refresh">Aktualisieren</button>

    <div id="status">Bereit.</div>
    <div id="bar"><div id="bar-fill"></div></div>

    <div class="section">Legende</div>
    <div id="legend-bar"></div>
    <div id="legend-labels"><span id="legend-min">–</span><span id="legend-max">–</span></div>
    <div id="legend-note"></div>
  </div>
</div>

<script>
"use strict";

// ---- Konfiguration je Modus -------------------------------------------------
const MODES = {
  hoehe:  { label: "Höhe",   min: 0, max: 4000, step: 50, def: 1500, unit: "m",
            grad: [[255,255,204],[255,237,160],[254,178,76],[253,141,60],
                   [252,78,42],[227,26,28],[177,0,38]],
            note: "Höhe = Geländehöhe über Meer (Copernicus-Höhenmodell)." },
  schnee: { label: "Schnee", min: 0, max: 200,  step: 5,  def: 30,   unit: "cm",
            grad: [[240,249,255],[204,224,244],[147,195,230],[74,152,209],
                   [30,110,183],[12,66,145],[28,40,120]],
            note: "Schnee = grobes Wettermodell (~11 km), kein Messwert vom Berg." }
};
const START = { lat: 46.8, lon: 10.5, zoom: 7 };

// ---- Zustand ----------------------------------------------------------------
let mode = "hoehe";
const thresholdByMode = { hoehe: MODES.hoehe.def, schnee: MODES.schnee.def };
const cache = {};
const overlay = L.layerGroup();
let running = false;
let lastCells = [];     // zuletzt abgetastete Zellen (für Antippen)

// ---- Karte ------------------------------------------------------------------
const map = L.map("map", { zoomControl: true }).setView([START.lat, START.lon], START.zoom);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 17, attribution: "© OpenStreetMap-Mitwirkende · Suche © Nominatim"
}).addTo(map);
overlay.addTo(map);

// Standort-Button (unten rechts)
const LocateControl = L.Control.extend({
  options: { position: "bottomright" },
  onAdd: function () {
    const div = L.DomUtil.create("div", "leaflet-bar");
    const a = L.DomUtil.create("a", "locate", div);
    a.href = "#"; a.title = "Mein Standort"; a.innerHTML = "📍";
    L.DomEvent.on(a, "click", (e) => { L.DomEvent.stop(e); locateMe(); });
    return div;
  }
});
map.addControl(new LocateControl());
let locateMarker = null;
function locateMe() {
  if (!navigator.geolocation) { statusEl.textContent = "Standort wird nicht unterstützt."; return; }
  statusEl.textContent = "Standort wird bestimmt …";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      map.setView(ll, Math.max(map.getZoom(), 11));
      if (locateMarker) locateMarker.setLatLng(ll);
      else locateMarker = L.circleMarker(ll, { radius: 7, color: "#fff", weight: 2, fillColor: "#2a7", fillOpacity: 1 }).addTo(map);
      statusEl.textContent = "Standort gefunden.";
    },
    () => { statusEl.textContent = "Standort nicht verfügbar (Freigabe nötig)."; },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ---- Info-Einblendung -------------------------------------------------------
const info = document.getElementById("info");
function updateInfo() {
  const c = map.getCenter();
  info.textContent = `Zoom ${map.getZoom()}   ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`;
}
map.on("move zoom", updateInfo); updateInfo();

// Wert antippen: passende Zelle suchen und Wert anzeigen
map.on("click", (e) => {
  const { lat, lng } = e.latlng;
  const cell = lastCells.find((c) => lat >= c.lat0 && lat <= c.lat1 && lng >= c.lon0 && lng <= c.lon1);
  let txt;
  if (!cell || cell.value == null) txt = "Keine Daten hier – erst „Aktualisieren“.";
  else txt = `<b>${Math.round(cell.value)} ${MODES[mode].unit}</b>`;
  L.popup().setLatLng(e.latlng).setContent(txt).openOn(map);
});

// ---- Bedienelemente ---------------------------------------------------------
const thresholdEl = document.getElementById("threshold");
const thresholdLbl = document.getElementById("threshold-label");
const resolutionEl = document.getElementById("resolution");
const resolutionLbl = document.getElementById("resolution-label");
const statusEl = document.getElementById("status");
const barFill = document.getElementById("bar-fill");
const refreshBtn = document.getElementById("refresh");

function applyMode(newMode) {
  mode = newMode;
  const m = MODES[mode];
  document.querySelectorAll(".modes button").forEach((b) =>
    b.classList.toggle("active", b.dataset.mode === mode));
  thresholdEl.min = m.min; thresholdEl.max = m.max; thresholdEl.step = m.step;
  thresholdEl.value = thresholdByMode[mode];
  thresholdLbl.textContent = `Schwelle: ${thresholdEl.value} ${m.unit}`;
  overlay.clearLayers(); lastCells = [];
  updateLegend(thresholdByMode[mode], m.max);
  saveSettings();
}
function updateThresholdLabel() {
  thresholdByMode[mode] = Number(thresholdEl.value);
  thresholdLbl.textContent = `Schwelle: ${thresholdEl.value} ${MODES[mode].unit}`;
  saveSettings();
}
function updateLegend(minVal, maxVal) {
  const m = MODES[mode];
  const stops = m.grad
    .map((c, i) => `rgb(${c[0]},${c[1]},${c[2]}) ${Math.round(i / (m.grad.length - 1) * 100)}%`)
    .join(", ");
  document.getElementById("legend-bar").style.background = `linear-gradient(to right, ${stops})`;
  document.getElementById("legend-min").textContent = `${Math.round(minVal)} ${m.unit}`;
  document.getElementById("legend-max").textContent = `${Math.round(maxVal)} ${m.unit}`;
  document.getElementById("legend-note").textContent = m.note;
}

document.querySelectorAll(".modes button").forEach((b) =>
  b.addEventListener("click", () => applyMode(b.dataset.mode)));
thresholdEl.addEventListener("input", updateThresholdLabel);
resolutionEl.addEventListener("input", () => {
  resolutionLbl.textContent = `Feinheit: ${resolutionEl.value} / 6`;
  saveSettings();
});

// Aufklappbares Blatt (Handy)
const panel = document.getElementById("panel");
document.getElementById("handle").addEventListener("click", () => panel.classList.toggle("collapsed"));

// Einstellungen merken
function saveSettings() {
  try {
    localStorage.setItem("schnee", JSON.stringify({
      mode, threshold: Number(thresholdEl.value), resolution: Number(resolutionEl.value)
    }));
  } catch (_) {}
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem("schnee") || "{}");
    if (s.mode && MODES[s.mode]) { thresholdByMode[s.mode] = s.threshold ?? MODES[s.mode].def; mode = s.mode; }
    if (s.resolution) resolutionEl.value = s.resolution;
  } catch (_) {}
}

// ---- Ortssuche (Nominatim) --------------------------------------------------
async function searchPlace() {
  const q = document.getElementById("search-input").value.trim();
  if (!q) return;
  statusEl.textContent = "Ort wird gesucht …";
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
    const arr = await (await fetch(url, { headers: { "Accept": "application/json" } })).json();
    if (arr.length) {
      map.setView([+arr[0].lat, +arr[0].lon], 11);
      statusEl.textContent = "Gefunden: " + (arr[0].display_name || q);
    } else statusEl.textContent = "Ort nicht gefunden.";
  } catch (err) { statusEl.textContent = "Suche fehlgeschlagen: " + err.message; }
}
document.getElementById("search-btn").addEventListener("click", searchPlace);
document.getElementById("search-input").addEventListener("keydown", (e) => { if (e.key === "Enter") searchPlace(); });

// ---- Datenabruf (Open-Meteo) ------------------------------------------------
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function key(lat, lon) { return `${mode}:${lat.toFixed(4)}:${lon.toFixed(4)}`; }

async function getJSON(url, tries = 2) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (err) {
      if (i === tries - 1) throw err;
      await sleep(600);   // kurz warten und einmal erneut versuchen
    }
  }
}
async function fetchValues(points) {
  const lat = points.map((p) => p[0].toFixed(5)).join(",");
  const lon = points.map((p) => p[1].toFixed(5)).join(",");
  if (mode === "hoehe") {
    const d = await getJSON(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`);
    return d.elevation;                                   // Meter
  }
  const d = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=snow_depth`);
  const entries = Array.isArray(d) ? d : [d];
  return entries.map((e) => (e.current && e.current.snow_depth != null) ? e.current.snow_depth * 100 : null);
}

// Feinheit-Stufe -> Kästchengröße in Karten-Pixeln (kleiner = feiner).
const STEP_PX = [64, 52, 42, 34, 26, 20];
const SAMPLE_MAX_CELLS = 500;   // Obergrenze, damit nicht zu viele Punkte abgefragt werden
function currentStep() { return STEP_PX[Number(resolutionEl.value) - 1] || 42; }

// Quadratisches Gitter auf einem FESTEN Raster der Kartenprojektion.
// Weil die Punkte an feste Rasterlinien einrasten, liegen beim Verschieben
// viele Punkte auf denselben Stellen -> sie kommen aus dem Cache statt neu
// abgefragt zu werden. Die Kästchen sind in der Projektion quadratisch und
// erscheinen daher auf dem Bildschirm als Quadrate.
function buildSquareGrid() {
  const SZ = map.getZoom();
  let step = currentStep();
  const b = map.getBounds();
  const pNW = map.project(b.getNorthWest(), SZ);
  const pSE = map.project(b.getSouthEast(), SZ);
  const w = pSE.x - pNW.x, h = pSE.y - pNW.y;
  let coarsened = false;
  while ((w / step) * (h / step) > SAMPLE_MAX_CELLS) { step *= 1.4; coarsened = true; }

  const x0 = Math.floor(pNW.x / step) * step, x1 = Math.ceil(pSE.x / step) * step;
  const y0 = Math.floor(pNW.y / step) * step, y1 = Math.ceil(pSE.y / step) * step;
  const cells = [];
  for (let y = y0; y < y1 - 1e-6; y += step)
    for (let x = x0; x < x1 - 1e-6; x += step) {
      const nw = map.unproject([x, y], SZ);
      const se = map.unproject([x + step, y + step], SZ);
      const ctr = map.unproject([x + step / 2, y + step / 2], SZ);
      cells.push({
        lat0: se.lat, lat1: nw.lat, lon0: nw.lng, lon1: se.lng,
        cLat: ctr.lat, cLon: ctr.lng, value: null
      });
    }
  return { cells, coarsened };
}

async function refresh() {
  if (running) return;
  running = true;
  refreshBtn.disabled = true; refreshBtn.textContent = "Lädt …";
  barFill.style.width = "0%"; statusEl.textContent = "Daten werden geladen …";

  const threshold = Number(thresholdEl.value);
  const { cells, coarsened } = buildSquareGrid();
  const missing = cells.filter((c) => cache[key(c.cLat, c.cLon)] === undefined);
  const total = cells.length;
  let done = total - missing.length;
  const setP = () => barFill.style.width = `${total ? Math.round(done / total * 100) : 0}%`;
  setP();

  const BATCH = 100;   // große Pakete -> möglichst wenige Anfragen
  try {
    for (let i = 0; i < missing.length; i += BATCH) {
      const chunk = missing.slice(i, i + BATCH);
      const values = await fetchValues(chunk.map((c) => [c.cLat, c.cLon]));
      chunk.forEach((c, idx) => { cache[key(c.cLat, c.cLon)] = values[idx]; });
      done += chunk.length; setP();
      statusEl.textContent = `Daten werden geladen … ${done}/${total} (${missing.length} neu)`;
      if (i + BATCH < missing.length) await sleep(250);
    }
    cells.forEach((c) => { c.value = cache[key(c.cLat, c.cLon)]; });
    draw(cells, threshold);
    if (coarsened) statusEl.textContent += " · Kästchen vergröbert – zum Verfeinern hineinzoomen.";
  } catch (err) {
    statusEl.textContent = "Fehler beim Laden: " + err.message;
  } finally {
    running = false;
    refreshBtn.disabled = false; refreshBtn.textContent = "Aktualisieren";
  }
}

// Mehrstufige Farbskala: interpoliert weich zwischen beliebig vielen Stützfarben.
function ramp(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const x = t * (stops.length - 1);
  const i = Math.min(Math.floor(x), stops.length - 2);
  const f = x - i, a = stops[i], b = stops[i + 1];
  return [
    Math.round(a[0] + (b[0] - a[0]) * f),
    Math.round(a[1] + (b[1] - a[1]) * f),
    Math.round(a[2] + (b[2] - a[2]) * f)
  ];
}

function draw(cells, threshold) {
  overlay.clearLayers();
  lastCells = cells;
  const m = MODES[mode];
  const above = cells.filter((c) => c.value != null && c.value >= threshold);
  const maxVal = above.reduce((mx, c) => Math.max(mx, c.value), threshold);
  const scaleMax = maxVal > threshold ? maxVal : threshold + 1;

  // Jedes Kästchen als eigenes Quadrat, eingefärbt nach der Farbskala.
  for (const c of above) {
    const t = (c.value - threshold) / (scaleMax - threshold);
    const col = ramp(m.grad, t);
    L.rectangle([[c.lat0, c.lon0], [c.lat1, c.lon1]], {
      stroke: true, color: "rgba(255,255,255,0.25)", weight: 0.5,
      fillColor: `rgb(${col[0]},${col[1]},${col[2]})`, fillOpacity: 0.62, interactive: false
    }).addTo(overlay);
  }
  barFill.style.width = "100%";
  updateLegend(threshold, scaleMax);
  statusEl.textContent = `Fertig – ${above.length} von ${cells.length} Feldern markiert.`;
}

refreshBtn.addEventListener("click", refresh);

// ---- Start ------------------------------------------------------------------
loadSettings();
applyMode(mode);
resolutionLbl.textContent = `Feinheit: ${resolutionEl.value} / 6`;

// Service Worker registrieren (für App-Installation)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
